<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malware Analyzer</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="main-container">
        
        <!-- ===== HEADER ===== -->
        <header class="app-header">
            <div class="logo-section">
                <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                </svg>
                <div>
                    <h1>Behavioral Malware Analyzer</h1>
                    <p class="subtitle">DGCNN + SGAN Hybrid Detection Engine</p>
                </div>
            </div>
        </header>

        <!-- ===== MAIN CONTENT ===== -->
        <main class="content-area">

            <!-- Upload Card -->
            <div class="card upload-card">
                <h2>Upload API Call Sequence</h2>
                <p class="description">
                    Provide a <strong>.txt</strong> file containing an ordered sequence of API call IDs.
                    Our hybrid engine evaluates the behavioral pattern to detect potential malware.
                </p>

                <div class="upload-container">
                    <label for="file-input" class="file-label">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21.2 15c.7-1.2 1-2.5.7-3.9-.6-2.4-2.8-4-5.4-4-1.6 0-3.1.8-4.1 2.1-1.5-1.4-3.7-1.8-5.7-.9-2.4 1.1-3.9 3.6-3.8 6.3.1 2.9 2.5 5.2 5.4 5.2H18c2.2 0 4-1.8 4-4 0-.5-.1-1-.2-1.4z"></path>
                            <path d="M12 12v9"></path>
                            <path d="m16 16-4-4-4 4"></path>
                        </svg>
                        <span id="file-name">Click to browse...</span>
                    </label>
                    <input type="file" id="file-input" accept=".txt" required>

                    <button type="button" id="analyze-button" class="analyze-btn">
                        <span class="button-text">Analyze File</span>
                        <div class="spinner hidden"></div>
                    </button>
                </div>
            </div>

            <!-- Results Card -->
            <div id="result-container" class="card result-card hidden">
                <!-- Filled dynamically by JS -->
            </div>

        </main>
    </div>

    <script src="/static/malware_analysis.js"></script>
</body>
</html>
