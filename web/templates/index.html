<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DGCNN Malware Analyzer</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="main-container">
        <header>
            <div class="header-content">
                <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                </svg>
                <h1>Behavioral Malware Analyzer</h1>
                <p class="subtitle">Powered by Deep Graph Convolutional Neural Networks</p>
            </div>
        </header>

        <main>
            <div class="card upload-card">
                <h2>Analyze Suspicious File</h2>
                <p>Upload a text file containing a sequence of API calls to check for malicious behavior.</p>

                <div class="upload-container">
                    <label for="file-input" class="file-label">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21.2 15c.7-1.2 1-2.5.7-3.9-.6-2.4-2.8-4-5.4-4-1.6 0-3.1.8-4.1 2.1-1.5-1.4-3.7-1.8-5.7-.9-2.4 1.1-3.9 3.6-3.8 6.3.1 2.9 2.5 5.2 5.4 5.2H18c2.2 0 4-1.8 4-4 0-.5-.1-1-.2-1.4z"></path>
                            <path d="M12 12v9"></path>
                            <path d="m16 16-4-4-4 4"></path>
                        </svg>
                        <span id="file-name">Choose a file...</span>
                    </label>
                    <input type="file" id="file-input" accept=".txt" required>
                    <button type="button" id="analyze-button">
                        <span class="button-text">Analyze</span>
                        <div class="spinner hidden"></div>
                    </button>
                </div>
            </div>

            <div id="result-container" class="card result-card hidden"></div>
        </main>
    </div>

    <!-- Main JS -->
    <script src="/static/malware_analysis.js"></script>
</body>
</html>
